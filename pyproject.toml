[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperinsight-agentflow"
version = "0.1.0"
description = "Agent-first PDF paper analysis workflow powered by MinerU and Longcat."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "OpenCode" }
]
dependencies = [
  "openai>=1.0.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.0.0",
  "PyMuPDF>=1.23.0",
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "rich>=13.0.0",
  "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
paperinsight = "paperinsight.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["paperinsight*"]
