mineru:
  enabled: true
  mode: api
  token: ""
  api_url: https://mineru.net/api/v4
  timeout: 600
  model_version: vlm
  output_format: markdown
  extract_tables: true
  method: auto
  download_retries: 3
  download_backoff: 1.5
  allow_insecure_result_download: true

llm:
  enabled: true
  provider: longcat
  api_key: ""
  timeout: 120
  longcat:
    model: LongCat-Flash-Chat
    base_url: https://api.longcat.chat/openai
    backfill_model: LongCat-Flash-Lite
    enable_lite_backfill: true

cleaner:
  enabled: true
  block_window: 1
  max_input_chars: 24000
  max_blocks: 80
  min_block_score: 3.0
  keep_table_context: true

cache:
  enabled: true
  directory: .cache
  max_age_days: 30

output:
  format: [excel]
  sort_by_if: true
  bilingual_text: false
